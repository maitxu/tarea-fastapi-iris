<svg xmlns="http://www.w3.org/2000/svg" width="1710" height="1000" viewBox="45 215 1710 1000" role="img" aria-labelledby="title desc">
<title id="title">Flujo técnico de la API Iris KNN</title>
<desc id="desc">Infografía de seis pasos con comandos y código: preparar el entorno, entrenar KNN k cuatro, probar FastAPI, ejecutar en Docker, abrir túnel ngrok y llamar a la API desde Colab.</desc>
<defs>
 <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#082E59"/><stop offset="1" stop-color="#0D527B"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0879C8"/><stop offset="1" stop-color="#2AA7E8"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#118A66"/><stop offset="1" stop-color="#32B989"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D98411"/><stop offset="1" stop-color="#F2B13B"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6847B6"/><stop offset="1" stop-color="#9271E0"/></linearGradient>
 <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#123B60" flood-opacity=".13"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#6787A2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>
  .f{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.title{font-size:41px;font-weight:750;fill:#fff}.sub{font-size:20px;fill:#DCEBFA}.step{font-size:15px;font-weight:800;letter-spacing:1px}.h{font-size:25px;font-weight:750;fill:#17324E}.body{font-size:17px;fill:#3E566D}.small{font-size:15px;fill:#5C7389}.code{font-size:15px;fill:#E7F1FB}.codeSmall{font-size:13px;fill:#E7F1FB}.label{font-size:13px;font-weight:750;letter-spacing:.5px}.foot{font-size:17px;font-weight:700;fill:#173A5C}
 </style>
</defs>
<rect width="1800" height="1450" fill="#F2F6FA"/>
<!-- Hero -->
<rect x="42" y="28" width="1716" height="158" rx="28" fill="url(#header)"/>
<circle cx="114" cy="107" r="43" fill="#fff" opacity=".13"/>
<!-- terminal/flow icon -->
<rect x="89" y="86" width="50" height="42" rx="8" fill="none" stroke="#F3FAFF" stroke-width="3"/><path d="M101 99l8 7-8 7M116 113h13" fill="none" stroke="#F3FAFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M178 57v100" stroke="#85B8D8" stroke-width="2"/>
<text class="f title" x="215" y="91">Flujo técnico · API Iris con KNN (k = 4)</text>
<text class="f sub" x="217" y="130">De los datos de entrenamiento a una predicción llamada desde Google Colab</text>
<rect x="1430" y="73" width="270" height="48" rx="24" fill="#fff" opacity=".14"/><text class="f step" x="1461" y="103" fill="#fff">6 PASOS · CÓDIGO REAL</text>

<!-- Row 1 arrows behind cards -->
<g fill="none" stroke="#6787A2" stroke-width="3" marker-end="url(#arrow)"><path d="M585 456h37"/><path d="M1165 456h37"/><path d="M1462 670v75"/><path d="M1202 968h-37"/><path d="M622 968h-37"/></g>

<!-- Step 1 card -->
<g filter="url(#shadow)"><rect x="55" y="235" width="530" height="435" rx="22" fill="#fff"/></g><path d="M77 235h486a22 22 0 0 1 22 22v8H55v-8a22 22 0 0 1 22-22" fill="url(#blue)"/>
<circle cx="102" cy="303" r="27" fill="#0879C8"/><text class="f" x="94" y="310" font-size="19" font-weight="800" fill="#fff">1</text><circle cx="521" cy="303" r="25" fill="#EAF5FC"/><text class="mono" x="503" y="309" font-size="17" font-weight="700" fill="#0879C8">&gt;_</text>
<text class="f step" x="142" y="298" fill="#0879C8">PREPARAR EL ENTORNO</text><text class="f h" x="85" y="357">Crear entorno e instalar</text>
<text class="f small" x="85" y="389">En PowerShell, desde la carpeta del proyecto:</text>
<rect x="82" y="410" width="476" height="127" rx="14" fill="#13283E"/>
<text class="mono code" x="101" y="443">python -m venv .venv</text>
<text class="mono code" x="101" y="478">.\.venv\Scripts\Activate.ps1</text>
<text class="mono code" x="101" y="513">pip install -r requirements.txt</text>
<circle cx="94" cy="573" r="5" fill="#2AA7E8"/><text class="f body" x="110" y="579">El prefijo <tspan font-weight="700">(.venv)</tspan> indica que está activo.</text>
<text class="f small" x="85" y="620">Mantén la terminal en la carpeta del proyecto.</text>

<!-- Step 2 -->
<g filter="url(#shadow)"><rect x="635" y="235" width="530" height="435" rx="22" fill="#fff"/></g><path d="M657 235h486a22 22 0 0 1 22 22v8H635v-8a22 22 0 0 1 22-22" fill="url(#green)"/>
<circle cx="682" cy="303" r="27" fill="#15936C"/><text class="f" x="674" y="310" font-size="19" font-weight="800" fill="#fff">2</text><circle cx="1101" cy="303" r="25" fill="#EAF7F2"/><text class="f" x="1082" y="309" font-size="15" font-weight="800" fill="#15936C">ML</text>
<text class="f step" x="722" y="298" fill="#15936C">ENTRENAR KNN</text><text class="f h" x="665" y="357">Ajustar el modelo</text>
<text class="f small" x="665" y="389">Ejecuta el entrenamiento y la evaluación:</text>
<rect x="662" y="410" width="476" height="58" rx="13" fill="#13283E"/><text class="mono code" x="682" y="446">python train_model.py</text>
<rect x="662" y="486" width="476" height="56" rx="12" fill="#E9F7F1"/><text class="f body" x="681" y="510" font-weight="700">Pipeline: StandardScaler + KNN (k=4)</text><text class="f small" x="681" y="531">El escalador se guarda junto con el clasificador.</text>
<text class="f label" x="666" y="575" fill="#16865F">ARCHIVOS CREADOS</text>
<text class="mono" x="666" y="602" font-size="14" fill="#29475F">artifacts/iris_knn_k4.pkl</text><text class="f tiny" x="944" y="602" font-size="13" fill="#5C7389">pipeline listo para predecir</text>
<text class="mono" x="666" y="630" font-size="14" fill="#29475F">data/iris_historico.csv</text><text class="f tiny" x="944" y="630" font-size="13" fill="#5C7389">histórico aparte</text>

<!-- Step 3 -->
<g filter="url(#shadow)"><rect x="1215" y="235" width="530" height="435" rx="22" fill="#fff"/></g><path d="M1237 235h486a22 22 0 0 1 22 22v8h-530v-8a22 22 0 0 1 22-22" fill="url(#orange)"/>
<circle cx="1262" cy="303" r="27" fill="#D98411"/><text class="f" x="1254" y="310" font-size="19" font-weight="800" fill="#fff">3</text><circle cx="1681" cy="303" r="25" fill="#FFF4E1"/><text class="f" x="1662" y="309" font-size="15" font-weight="800" fill="#C27910">API</text>
<text class="f step" x="1302" y="298" fill="#C27910">FASTAPI LOCAL</text><text class="f h" x="1245" y="357">Iniciar y probar Swagger</text>
<text class="f small" x="1245" y="389">Inicia el servidor de desarrollo:</text>
<rect x="1242" y="410" width="476" height="58" rx="13" fill="#13283E"/><text class="mono code" x="1261" y="446">uvicorn app:app --reload</text>
<text class="f label" x="1246" y="505" fill="#BE7616">ABRIR EN EL NAVEGADOR</text><rect x="1242" y="519" width="476" height="43" rx="10" fill="#FFF4E1"/><text class="mono" x="1259" y="547" font-size="14" fill="#79511B">http://127.0.0.1:8000/docs</text>
<rect x="1242" y="578" width="229" height="59" rx="11" fill="#F1F6FA"/><text class="f label" x="1257" y="600" fill="#39708F">GET</text><text class="mono" x="1257" y="623" font-size="14" fill="#29475F">/health</text>
<rect x="1487" y="578" width="231" height="59" rx="11" fill="#F1F6FA"/><text class="f label" x="1502" y="600" fill="#39708F">POST</text><text class="mono" x="1502" y="623" font-size="14" fill="#29475F">/predict</text>

<!-- Step 4 lower right -->
<g filter="url(#shadow)"><rect x="1215" y="755" width="530" height="435" rx="22" fill="#fff"/></g><path d="M1237 755h486a22 22 0 0 1 22 22v8h-530v-8a22 22 0 0 1 22-22" fill="url(#blue)"/>
<circle cx="1262" cy="823" r="27" fill="#0879C8"/><text class="f" x="1254" y="830" font-size="19" font-weight="800" fill="#fff">4</text><circle cx="1681" cy="823" r="25" fill="#EAF5FC"/><text class="f" x="1664" y="829" font-size="14" font-weight="800" fill="#0879C8">BOX</text>
<text class="f step" x="1302" y="818" fill="#0879C8">DOCKER</text><text class="f h" x="1245" y="877">Empaquetar la API</text>
<text class="f small" x="1245" y="909">Detén Uvicorn antes de ocupar el puerto 8000.</text>
<text class="f label" x="1246" y="950" fill="#176FAA">CONSTRUIR IMAGEN</text><rect x="1242" y="963" width="476" height="58" rx="12" fill="#13283E"/><text class="mono codeSmall" x="1257" y="998">docker build -t iris-knn-api .</text>
<text class="f label" x="1246" y="1050" fill="#176FAA">EJECUTAR CONTENEDOR</text><rect x="1242" y="1063" width="476" height="58" rx="12" fill="#13283E"/><text class="mono codeSmall" x="1257" y="1098">docker run --rm -p 8000:8000 iris-knn-api</text>
<text class="f small" x="1246" y="1158">Swagger vuelve a estar en localhost:8000/docs</text>

<!-- Step 5 lower middle -->
<g filter="url(#shadow)"><rect x="635" y="755" width="530" height="435" rx="22" fill="#fff"/></g><path d="M657 755h486a22 22 0 0 1 22 22v8H635v-8a22 22 0 0 1 22-22" fill="url(#purple)"/>
<circle cx="682" cy="823" r="27" fill="#6847B6"/><text class="f" x="674" y="830" font-size="19" font-weight="800" fill="#fff">5</text><circle cx="1101" cy="823" r="25" fill="#F1ECFB"/><text class="f" x="1086" y="829" font-size="14" font-weight="800" fill="#6847B6">URL</text>
<text class="f step" x="722" y="818" fill="#6847B6">NGROK</text><text class="f h" x="665" y="877">Abrir túnel seguro</text>
<text class="f small" x="665" y="909">Configura el token una sola vez, solo en tu equipo:</text>
<rect x="662" y="926" width="476" height="58" rx="12" fill="#13283E"/><text class="mono codeSmall" x="678" y="961">ngrok config add-authtoken TU_TOKEN</text>
<text class="f small" x="665" y="1008">No incluyas el token en el repositorio. Con Docker activo:</text>
<rect x="662" y="1022" width="476" height="58" rx="12" fill="#13283E"/><text class="mono code" x="682" y="1058">ngrok http 8000</text>
<rect x="662" y="1096" width="476" height="60" rx="12" fill="#F1ECFB"/><text class="f body" x="680" y="1121" font-weight="700">Copia la URL HTTPS que aparece en ngrok.</text><text class="f small" x="680" y="1144">Mantén activas las ventanas de Docker y ngrok.</text>

<!-- Step 6 lower left -->
<g filter="url(#shadow)"><rect x="55" y="755" width="530" height="435" rx="22" fill="#fff"/></g><path d="M77 755h486a22 22 0 0 1 22 22v8H55v-8a22 22 0 0 1 22-22" fill="url(#green)"/>
<circle cx="102" cy="823" r="27" fill="#15936C"/><text class="f" x="94" y="830" font-size="19" font-weight="800" fill="#fff">6</text><circle cx="521" cy="823" r="25" fill="#EAF7F2"/><text class="f" x="503" y="829" font-size="14" font-weight="800" fill="#15936C">Co</text>
<text class="f step" x="142" y="818" fill="#15936C">GOOGLE COLAB</text><text class="f h" x="85" y="877">Llamar a la API remota</text>
<text class="f small" x="85" y="909">Sustituye la URL por la que te dio ngrok:</text>
<rect x="82" y="926" width="476" height="196" rx="13" fill="#13283E"/>
<text class="mono codeSmall" x="98" y="953">import requests</text>
<text class="mono codeSmall" x="98" y="980">BASE_URL = "https://&lt;tu-url-ngrok&gt;"</text>
<text class="mono codeSmall" x="98" y="1016">requests.get(</text><text class="mono codeSmall" x="115" y="1037">f"{BASE_URL}/health").json()</text>
<text class="mono codeSmall" x="98" y="1073">datos = {"sepal_length": 5.1, "sepal_width": 3.5,</text>
<text class="mono codeSmall" x="145" y="1094">"petal_length": 1.4, "petal_width": 0.2}</text>
<text class="mono codeSmall" x="98" y="1116">requests.post(f"{BASE_URL}/predict", json=datos)</text>
<rect x="82" y="1137" width="476" height="34" rx="10" fill="#EAF7F2"/><text class="f small" x="96" y="1160" font-weight="700" fill="#147B5B">Esperado: HTTP 200 · especie setosa · k=4</text>

<!-- Bottom flow strip -->
<rect x="55" y="1230" width="1690" height="160" rx="22" fill="#E5EDF5" stroke="#C0D0DE" stroke-width="1.5"/>
<rect x="78" y="1252" width="260" height="54" rx="13" fill="#0B4978"/><text class="f" x="101" y="1287" font-size="16" font-weight="800" fill="#fff">RECORRIDO DE LA PETICIÓN</text>
<g class="f" font-size="17" font-weight="700" fill="#244A69">
 <rect x="370" y="1258" width="142" height="43" rx="12" fill="#fff"/><text x="395" y="1286">Colab</text>
 <text x="527" y="1286" fill="#7A91A6">→</text>
 <rect x="558" y="1258" width="215" height="43" rx="12" fill="#fff"/><text x="581" y="1286">URL HTTPS ngrok</text>
 <text x="790" y="1286" fill="#7A91A6">→</text>
 <rect x="820" y="1258" width="223" height="43" rx="12" fill="#fff"/><text x="842" y="1286">FastAPI en Docker</text>
 <text x="1060" y="1286" fill="#7A91A6">→</text>
 <rect x="1090" y="1258" width="214" height="43" rx="12" fill="#fff"/><text x="1112" y="1286">Pipeline del PKL</text>
 <text x="1321" y="1286" fill="#7A91A6">→</text>
 <rect x="1352" y="1258" width="350" height="43" rx="12" fill="#fff"/><text x="1375" y="1286">Especie + distancias</text>
</g>
<text class="f small" x="370" y="1347">El histórico CSV se conserva para reproducir o reentrenar; no se carga durante la predicción.</text>
</svg>

